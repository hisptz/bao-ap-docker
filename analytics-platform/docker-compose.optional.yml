services:
    pyserve:
        image: ghcr.io/hisptz/bao-ap-docker/pyserve:latest
        mem_limit: 4gb
        ports:
            - "9097:8000"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - ap
